name: NMLify web

# Cost note: same as the pytest workflow — public repos are unlimited,
# private repos draw from the 2,000-3,000 free minute pool. The full
# install + test + build cycle finishes in well under a minute.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't burn minutes on stale pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + test + build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Run Vitest
        run: npm test

      - name: Build (vite)
        run: npm run build
        env:
          # Points the static Pages bundle at the Vercel serverless token
          # endpoint so public playlists load without login. Set this as a
          # repository variable (Settings → Secrets and variables → Actions →
          # Variables), e.g. https://<your-app>.vercel.app/api/spotify-token.
          # If unset, the build falls back to the same-origin "/api/spotify-token"
          # (only correct when the whole site is hosted on Vercel), and Pages
          # users are prompted to log in for every playlist.
          VITE_SPOTIFY_TOKEN_ENDPOINT: ${{ vars.VITE_SPOTIFY_TOKEN_ENDPOINT }}

      - name: Upload Pages artifact
        # Skip artifact upload on PR builds; only main pushes deploy.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only deploy on pushes to main (and on manual dispatch). PRs just build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Required by actions/deploy-pages to publish + mint the OIDC token.
      pages: write
      id-token: write
    # Recommended by the GitHub Pages docs: serialise deploys so two pushes
    # in quick succession don't race. We do NOT cancel in-progress deploys —
    # if one is mid-publish we let it finish before the next one starts.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
